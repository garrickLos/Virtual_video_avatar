<main class="container">
  <!-- <body> tag weggehaald, want dat is ongeldige HTML binnen een component -->
  <div id="character_screen" class="scene">
    <section id="settings-wrap">
      <label id="stream-toggle" class="stream-toggle">
        <input type="checkbox" id="hideSettingsToggle">
        <span class="stream-toggle-track"></span>
      </label>

      <div id="settings">
        <app-button buttonId="spinButton" [classes]="['talking_button']" buttonType="button">
          Click to talk
          <div id="recording_item"></div>
        </app-button>

        <app-button buttonId="Character settings" [classes]="['floating-faq-btn']">
          Documentation (FAQ)
        </app-button>

        <app-button buttonId="new_FAQWindow" [classes]="['floating-faq-btn']">
          Documentation (FAQ)
        </app-button>
      </div>
    </section>

    <div class="character-stage">
      <div id="entire_body">
        <div id="rotating" class="head-stage character">
          <div id="debug-stip"></div>
          <img id="character_head" class="character character-head" alt="Character head">
        </div>
        <img id="character_body" class="character character-body" alt="CHaracter body">
      </div>
    </div>
  </div>
</main>
