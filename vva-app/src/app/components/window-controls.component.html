<header class="custom-titlebar" data-tauri-drag-region (mousedown)="startDragging($event)">
    <div class="window-dressup">
        <img src="assets/logo-v1.svg" alt="Logo" class="logo" />
        <span class="title-text">Mijn App</span>
    </div>
    <div class="window-controls">
        <app-button
            buttonId="minimize-button"
            ariaLabel="Minimaliseren"
            [classes]="['window-control-button', 'minimize']"
            (click)="minimize()"
        >_</app-button>
        <app-button
            buttonId="maximize-button"
            ariaLabel="Maximaliseren"
            [classes]="['window-control-button', 'maximize']"
            (click)="maximize()"
        >☐</app-button>
        <app-button
            buttonId="close-button"
            ariaLabel="Sluiten"
            [classes]="['window-control-button', 'close']"
            (click)="close()"
        >X</app-button>
    </div>
</header>
